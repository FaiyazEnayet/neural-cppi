[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "neural-cppi"
version = "1.3.0"
description = "Neural portfolio insurance: a network learns dynamic asset allocation under transaction costs, benchmarked against classic CPPI on real market scenarios."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Faiyaz Enayet" }]
requires-python = ">=3.10"
dependencies = ["beautifulsoup4>=4.11", 
    "numpy>=1.24",
    "torch>=2.0",
    "plotly>=5.0",
    "matplotlib>=3.6",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/FaiyazEnayet/neural-cppi"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
